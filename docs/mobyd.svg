      <stop offset="0.45" stop-color="#e6f3f7" stop-opacity="0.96"/>
      <stop offset="0.8" stop-color="#a8cfdb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fb4c4" stop-opacity="0.3"/>
