<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a52"/>
      <stop offset="0.38" stop-color="#081c2c"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="330" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9fbff" stop-opacity="0.9"/>
      <stop offset="0.22" stop-color="#8fe6f0" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#3fb6c8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#3fb6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1">
