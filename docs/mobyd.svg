      <path d="M50 3 C60 3 66.5 7 67 16 C67.8 27 69.4 37 69 47 C74.5 51 80 58 82 67 C75.5 65 70.5 62 67.6 58.5 C65 78 58.5 100 53.4 118 C59 123 73 127 85 139 C72 134.5 60 133 50 136 C40 133 28 134.5 15 139 C27 127 41 123 46.6 118 C41.5 100 35 78 32.4 58.5 C29.5 62 24.5 65 18 67 C20 58 25.5 51 31 47 C30.6 37 32.2 27 33 16 C33.5 7 40 3 50 3 Z" fill="#bff4ff" opacity="0.5" filter="url(#soft)" transform="translate(50 70) scale(1.05) translate(-50 -70)"/>
      <path d="M50 3 C60 3 66.5 7 67 16 C67.8 27 69.4 37 69 47 C74.5 51 80 58 82 67 C75.5 65 70.5 62 67.6 58.5 C65 78 58.5 100 53.4 118 C59 123 73 127 85 139 C72 134.5 60 133 50 136 C40 133 28 134.5 15 139 C27 127 41 123 46.6 118 C41.5 100 35 78 32.4 58.5 C29.5 62 24.5 65 18 67 C20 58 25.5 51 31 47 C30.6 37 32.2 27 33 16 C33.5 7 40 3 50 3 Z" fill="url(#whale)"/>
