<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a52"/>
      <stop offset="0.38" stop-color="#081c2c"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="330" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9fbff" stop-opacity="0.9"/>
      <stop offset="0.22" stop-color="#8fe6f0" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#3fb6c8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#3fb6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e6f3f7" stop-opacity="0.96"/>
      <stop offset="0.8" stop-color="#a8cfdb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fb4c4" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sea)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
    <!-- rings of light far above -->
    <g fill="none" stroke="#c9f7ff">
      <circle cx="512" cy="330" r="150" stroke-width="3" opacity="0.55"/>
      <circle cx="512" cy="330" r="232" stroke-width="2" opacity="0.22"/>
      <circle cx="512" cy="330" r="318" stroke-width="1.5" opacity="0.1"/>
    </g>
    <!-- the whale, upright, its tail lost in the dark -->
    <g transform="translate(512 236) scale(5.1) translate(-50 0)">
      <path d="M50 3 C60 3 66.5 7 67 16 C67.8 27 69.4 37 69 47 C74.5 51 80 58 82 67 C75.5 65 70.5 62 67.6 58.5 C65 78 58.5 100 53.4 118 C59 123 73 127 85 139 C72 134.5 60 133 50 136 C40 133 28 134.5 15 139 C27 127 41 123 46.6 118 C41.5 100 35 78 32.4 58.5 C29.5 62 24.5 65 18 67 C20 58 25.5 51 31 47 C30.6 37 32.2 27 33 16 C33.5 7 40 3 50 3 Z" fill="#bff4ff" opacity="0.5" filter="url(#soft)" transform="translate(50 70) scale(1.05) translate(-50 -70)"/>
      <path d="M50 3 C60 3 66.5 7 67 16 C67.8 27 69.4 37 69 47 C74.5 51 80 58 82 67 C75.5 65 70.5 62 67.6 58.5 C65 78 58.5 100 53.4 118 C59 123 73 127 85 139 C72 134.5 60 133 50 136 C40 133 28 134.5 15 139 C27 127 41 123 46.6 118 C41.5 100 35 78 32.4 58.5 C29.5 62 24.5 65 18 67 C20 58 25.5 51 31 47 C30.6 37 32.2 27 33 16 C33.5 7 40 3 50 3 Z" fill="url(#whale)"/>
    </g>
    <!-- commits riding the rings -->
    <g fill="#04121c" stroke="#5eead4" stroke-width="4"><circle cx="630.2" cy="237.7" r="8.5"/><circle cx="727.1" cy="243.1" r="8.5"/><circle cx="294.0" cy="250.7" r="8.5"/><circle cx="236.6" cy="489.0" r="8.5"/></g>
    <g fill="#d6f6ff">
      <circle cx="250" cy="520" r="3.5" opacity="0.5"/><circle cx="300" cy="730" r="2.5" opacity="0.4"/><circle cx="790" cy="760" r="3" opacity="0.35"/><circle cx="820" cy="420" r="2.5" opacity="0.4"/><circle cx="200" cy="330" r="2.5" opacity="0.35"/><circle cx="640" cy="840" r="2.5" opacity="0.3"/>
    </g>
  </g>
</svg>
