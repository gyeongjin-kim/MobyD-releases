    <g fill="#04121c" stroke="#5eead4" stroke-width="4.5"><circle cx="372.9" cy="273.8" r="9"/><circle cx="493.7" cy="181.1" r="9"/><circle cx="633.4" cy="241.8" r="9"/><circle cx="730.0" cy="250.7" r="9"/><circle cx="289.0" cy="266.1" r="9"/><circle cx="206.3" cy="417.7" r="9"/></g>
